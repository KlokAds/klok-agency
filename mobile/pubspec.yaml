name: klokfinance
description: Klok Finance - the agency's own Android app (the site inside, notifications with sound, payment SMS forwarding).
publish_to: none
# Raise this only when several phone-side changes have piled up: the pages inside come from the
# site and are always new. A raise (pushed to main) builds and ships a new APK.
version: 1.0.5+6

environment:
    sdk: '>=3.5.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    crypto: ^3.0.6
    firebase_core: ^3.13.0
    firebase_messaging: ^15.2.5
    flutter_local_notifications: ^19.1.0
    flutter_inappwebview: ^6.1.5
    http: ^1.2.2
    local_auth: ^2.3.0
    package_info_plus: ^8.3.0
    permission_handler: ^12.0.0
    shared_preferences: ^2.3.3
    url_launcher: ^6.3.1

dev_dependencies:
    flutter_launcher_icons: ^0.14.3

flutter:
    uses-material-design: true

flutter_launcher_icons:
    android: true
    ios: false
    image_path: assets/icon.png
    adaptive_icon_background: '#0F1F1C'
    adaptive_icon_foreground: assets/icon-foreground.png
    min_sdk_android: 23
